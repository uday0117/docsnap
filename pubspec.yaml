name: docsnap
description: "DocSnap - PDF Scanner & Document Manager. Scan, crop, filter, OCR, QR and manage documents."
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & storage
  get: ^4.6.6
  get_storage: ^2.1.1

  # Camera & image
  camera: ^0.10.6
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  image: ^4.2.0

  # QR / Barcode scanner
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0

  # OCR
  google_mlkit_text_recognition: ^0.14.0

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.4
  syncfusion_flutter_pdfviewer: ^33.2.8
  syncfusion_flutter_pdf: ^33.2.8

  # Document scanner (OpenCV / VisionKit edge detection)
  flutter_document_scanner: ^1.1.2

  # Local database (Hive migration from GetStorage)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Cloud backup OAuth
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  oauth2: ^2.0.3
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2

  # File system
  path_provider: ^2.1.5
  path: ^1.9.0
  archive: ^4.0.2

  # Share & permissions
  share_plus: ^10.1.4
  permission_handler: ^11.3.1

  # Signature
  signature: ^5.5.0

  # UI utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1

  # Animations
  flutter_animate: ^4.5.0

  # Firebase & Ads (Android)
  firebase_core: ^4.10.0
  firebase_analytics: ^12.1.2
  firebase_crashlytics: ^5.0.7
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app-logo-square.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon/
    - privacy_policy.html
    - terms_and_conditions.html

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
